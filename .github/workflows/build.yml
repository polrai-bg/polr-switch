name: Build and verify Mac app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check scripts and whitespace
        run: |
          bash -n build.sh release.sh
          git diff --check
      - name: Build and run regression checks
        run: bash build.sh
      - name: Verify downloadable archive
        run: |
          APP_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' Info.plist)
          bash release.sh "dist/$APP_NAME.app"
